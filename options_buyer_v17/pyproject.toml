[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-buyer-v17"
version = "1.7.0"
description = "Options buyer order-flow trading rules engine (v1.7 finalized playbook)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "soairrain" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
options-buyer = "options_buyer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["options_buyer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
